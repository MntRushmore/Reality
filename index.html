<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reality</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', 'Lucida Console', monospace;
            background: #1a1a2e;
            color: #eee;
            overflow-x: hidden;
            font-size: 16px;
            line-height: 1.4;
            font-weight: normal;
            cursor: pointer;
            transition: background 0.5s, color 0.5s;
        }
        
        .page {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 60px 60px 60px 120px;
            box-sizing: border-box;
        }
        
        .page-1 { background: #1a1a2e; }
        .page-2 { background: #16213e; }
        .page-3 { background: #0f3460; }
        .page-4 { background: #0e4b99; }
        .page-5 { background: #2e8b57; }
        .page-7 { background: #3b3b5e; }
        
        .title {
            font-size: 64px;
            font-weight: normal;
            margin-bottom: 40px;
            margin-top: 80px;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            white-space: nowrap;
            width: 0;
            animation: typewriterTitle 2s steps(15, end) 0.5s both;
            border-right: 3px solid #f39c12;
        }
        
        .title.finished {
            border-right: none;
            width: auto;
        }
        
        .main-text {
            font-size: 20px;
            line-height: 1.8;
            max-width: 900px;
            font-family: 'Courier New', monospace;
            font-weight: normal;
            opacity: 0;
            animation: fadeInPulse 2s ease-in-out infinite alternate;
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 40px;
            font-weight: normal;
            margin-bottom: 30px;
            margin-top: 40px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #f39c12, 0 0 20px #f39c12;
        }
        
        .bottom-section {
            position: absolute;
            bottom: 30px;
            left: 120px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .doomscroll-text {
            font-size: 18px;
            font-family: 'Courier New', monospace;
            animation: pulseText 1.2s infinite alternate;
        }
        
        .doomscroll-text:hover {
            color: #FF6B6B;
            cursor: pointer;
        }
        
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .progress-bar {
            width: 200px;
            height: 20px;
            border: 2px solid #f39c12;
            background: #1a1a2e;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: #f39c12;
            width: 0%;
            animation: progressFill 8s linear infinite;
        }
        
        .progress-blocks {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        .hack-club-badge {
            position: fixed;
            top: 30px;
            right: 30px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid #FFFFFF;
            background: #0000FF;
            z-index: 1000;
            animation: glowBadge 1.5s infinite alternate;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            animation: blink 1.5s infinite;
        }
        
        .content-block {
            margin: 20px 0;
            max-width: 800px;
        }
        
        .terminal-line {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            margin: 10px 0;
        }
        
        .green-text {
            color: #00FF00;
        }

        .click-dot {
          position: absolute;
          width: 12px;
          height: 12px;
          background: rgba(255, 0, 0, 0.5);
          border-radius: 50%;
          pointer-events: none;
          animation: fadeDot 2s forwards;
          z-index: 9999;
        }

        @keyframes fadeDot {
          from { opacity: 1; transform: scale(1); }
          to { opacity: 0; transform: scale(2); }
        }

        .profile-box {
          background: rgba(0, 0, 0, 0.6);
          color: #00ff00;
          font-family: 'Courier New', monospace;
          font-size: 14px;
          padding: 20px;
          border: 1px solid #00ff00;
          margin-top: 20px;
          max-width: 400px;
        }
        
        @keyframes typewriterTitle {
            0% { width: 0; }
            100% { width: 100%; }
        }
        
        @keyframes fadeInText {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeInPulse {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }
        
        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes pulseText {
            0% { color: #FF6B6B; transform: scale(1); }
            100% { color: #FF3B3B; transform: scale(1.05); }
        }

        @keyframes glowBadge {
            0% { box-shadow: 0 0 5px #00ffff; }
            100% { box-shadow: 0 0 20px #00ffff; }
        }
        
        @media (max-width: 768px) {
            .page {
                padding: 40px 30px 40px 40px;
            }
            
            .title {
                font-size: 36px;
                margin-bottom: 30px;
                margin-top: 60px;
            }
            
            .main-text {
                font-size: 16px;
                margin-bottom: 40px;
            }
            
            .page-title {
                font-size: 28px;
                margin-bottom: 20px;
                margin-top: 30px;
            }
            
            .bottom-section {
                left: 40px;
                right: 30px;
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
        }

        .background-container {
          position: relative;
          width: 100%;
          height: 100vh;
          overflow: hidden;
        }

        .background-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
        }

        .center-text {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          font-family: 'Courier New', monospace;
          font-size: 48px;
          color: #fff;
          text-shadow: 0 0 10px #f39c12, 0 0 20px #f39c12;
        }

        .center-text .highlight {
          color: #f39c12;
          text-decoration: none;
        }

        .center-text .highlight:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
  <div class="background-container">
    <img src="https://hc-cdn.hel1.your-objectstorage.com/s/v3/ed36098ce49716544f96bf3cb6e0f5f77b6a5e56_image.png" alt="Reality Image" class="background-image" />
    <div class="overlay"></div>
    <div class="center-text">
      <a href="https://reality-8a7avcysr.hackclub.dev/" class="highlight">reality</a> is over!
    </div>
  </div>
</body>
</html>
